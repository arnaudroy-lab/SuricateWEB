# Intégration continue minimale : la suite de tests du cœur (Node, aucune dépendance à installer).
name: Tests
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Premier lancement de Chrome sur une machine froide : lent. On le fait une fois ici pour que les tests en parallèle ne s'y attendent pas.
      - run: google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom about:blank > /dev/null 2>&1 || true
      # `npm test` échoue avec certaines versions de Node (voir CLAUDE.md) : on lance le lanceur de tests directement.
      - run: node --disable-warning=ExperimentalWarning --test test/*.test.js
        env:
          # Les tests d'interface lancent Chrome. Sur les machines GitHub récentes, son bac à sable est refusé au démarrage ; la machine est jetable.
          CHROME_NO_SANDBOX: '1'
